name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codequest
          POSTGRES_PASSWORD: codequest
          POSTGRES_DB: codequest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @codequest/api
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Lint
        run: npm run lint -w @codequest/api
      - name: Type check
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Unit tests
        run: npm run test -w @codequest/api
      - name: Build API
        run: npm run build -w @codequest/api
      - name: Build web
        run: npm ci --workspace @codequest/web && npm run build -w @codequest/web
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm audit --audit-level=high --workspaces

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          platforms: linux/amd64
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          platforms: linux/amd64
      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: ./services/runner
          push: false
          platforms: linux/amd64
