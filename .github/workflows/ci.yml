name: CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint & Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md,yaml}"

      - name: Run ESLint
        run: npm run lint