openapi: 3.0.3
info:
  title: CodeQuest API - Module Authentification
  version: 1.0.0
  description: Spécification des endpoints d'authentification et de gestion de profil pour CodeQuest.
paths:
  /api/v1/auth/register:
    post:
      summary: Inscription d'un nouvel utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Compte créé. E-mail de confirmation envoyé.
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          description: E-mail ou pseudo déjà utilisé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Connexion utilisateur
      description: Reçoit les identifiants et pose les cookies HttpOnly (Access et Refresh Tokens).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Connexion réussie. Cookies HTTP posés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Identifiants invalides (message générique).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Blocage temporaire après 5 échecs consécutifs.

  /api/v1/auth/logout:
    post:
      summary: Déconnexion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allSessions:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Session(s) révoquée(s) et cookies supprimés.

  /api/v1/auth/refresh:
    post:
      summary: Rafraîchissement du jeton d'accès
      responses:
        '200':
          description: Nouveau jeton d'accès émis dans le cookie.
        '401':
          description: Jeton de rafraîchissement invalide ou expiré.

  /api/v1/auth/forgot-password:
    post:
      summary: Demande de réinitialisation de mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Réponse identique que l'e-mail existe ou non (anti-enumération).

  /api/v1/auth/reset-password:
    post:
      summary: Validation du nouveau mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: Mot de passe mis à jour. Sessions révoquées.
        '400':
          description: Jeton invalide ou expiré.

  /api/v1/me:
    get:
      summary: Récupération du profil courant
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    patch:
      summary: Mise à jour du profil utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
    delete:
      summary: Suppression logique du compte (RGPD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Compte désactivé immédiatement et planifié pour anonymisation.

components:
  schemas:
    RegisterDto:
      type: object
      required: [email, pseudo, password]
      properties:
        email:
          type: string
          format: email
        pseudo:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 12

    LoginDto:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: E-mail ou Pseudo
        password:
          type: string

    ResetPasswordDto:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 12

    UpdateProfileDto:
      type: object
      properties:
        preferredLanguage:
          type: string
          example: 'javascript'
        theme:
          type: string
          enum: [dark, light]
        soundEnabled:
          type: boolean

    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        pseudo:
          type: string
        emailVerified:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        preferredLanguage:
          type: string
        theme:
          type: string
        soundEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string

  responses:
    400BadRequest:
      description: Erreur de validation des données entrantes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Session non authentifiée ou jeton invalide.
