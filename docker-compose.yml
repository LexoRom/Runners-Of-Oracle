name: codequest

# Ports hôtes non standards pour éviter les collisions avec des services locaux.
# Voir .env.example pour les URLs correspondantes.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codequest}
      POSTGRES_DB: ${POSTGRES_DB:-codequest}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codequest} -d ${POSTGRES_DB:-codequest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cq-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Services optionnels (profil "full") ─────────────────────────────────────
  # Activés avec : docker compose --profile full up -d
  minio:
    image: minio/minio:latest
    container_name: cq-minio
    restart: unless-stopped
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-codequest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-codequest123}
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cq-mailhog
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "1025:1025"
      - "8025:8025"

  # LiveKit (chat vocal) = Could, hors périmètre v1 — non inclus.

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cq-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://codequest:codequest@postgres:5432/codequest?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      API_PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      WEB_APP_URL: http://localhost:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cq-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: ./services/runner
      dockerfile: Dockerfile
    container_name: cq-runner
    restart: unless-stopped
    environment:
      RUNNER_PORT: 4000
      RUNNER_TIMEOUT_MS: 5000
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  redisdata:
  miniodata:
